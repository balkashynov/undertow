name: Verify Undertow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q
      - run: python -m build
      - run: node --check src/undertow/web/app.js
      - run: node --check src/undertow/web/engine.js
  kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[lab]'
      - run: .venv/bin/python scripts/lab.py --output /tmp/undertow-ci-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kafka-evidence
          path: /tmp/undertow-ci-evidence
